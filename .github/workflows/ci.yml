name: CI

on:
  pull_request:
    branches:
      - test
      - main
  push:
    branches:
      - test
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Check & Build RPM (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml

      - name: Install Tauri CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo-binstall --no-confirm tauri-cli

      - name: Test RPM Package Build
        run: cargo tauri build --bundles rpm

      - name: Upload Smoke Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adwaid-view-ci-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
