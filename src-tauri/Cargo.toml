[package]
name = "adwaid-view"
version = "0.1.0"
description = "Distraction-free Linux desktop Markdown editor and viewer for Fedora 45"
authors = ["adwaid"]
edition = "2021"

[lib]
name = "adwaid_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
